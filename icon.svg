<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 纯白背景 -->
  <rect width="200" height="200" fill="#FFFFFF" />
  
  <!-- 宝石蓝主外框 (药丸/手柄形态) -->
  <rect x="30" y="62" width="140" height="76" rx="38" fill="#0F52BA" />
  
  <!-- 左右摇杆/表盘底座 (纯白) -->
  <circle cx="68" cy="100" r="20" fill="#FFFFFF" />
  <circle cx="132" cy="100" r="20" fill="#FFFFFF" />
  
  <!-- 左侧：摇杆内点 -->
  <circle cx="68" cy="100" r="7.5" fill="#0F52BA" />
  
  <!-- 右侧：时钟指针 (12点和3点方向) -->
  <path d="M 132 100 L 132 87.5 M 132 100 L 142 100" 
        stroke="#0F52BA" stroke-width="4.5" 
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
